# Render Blueprint — backend API (frontend lives on Vercel).
# Update `repo` to your GitHub repo before using "New from Blueprint".
services:
  - type: web
    name: shram-jagaran-api
    runtime: go
    repo: https://github.com/YOUR_ORG/dad_website
    branch: main
    rootDir: backend
    buildCommand: go build -o bin/server ./cmd/api
    startCommand: ./bin/server
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: HTTP_PORT
        value: "8080"
      - key: FRONTEND_URL
        sync: false # set to your Vercel URL, e.g. https://your-app.vercel.app
      - key: CORS_ORIGINS
        sync: false # same as FRONTEND_URL
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUSTED_PROXIES
        value: "10.0.0.0/8"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false # required: boot refuses default in production
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 168h
      - key: JWT_ISSUER
        value: shram-jagaran-cms
      - key: R2_ENABLED
        value: "false"
      - key: REDIS_URL
        sync: false # set to Upstash URL when enabled; empty = caching disabled
      - key: SENTRY_ENABLED
        value: "false"
      - key: RATE_LIMIT_REQUESTS
        value: "100"
      - key: HTTP_IDLE_TIMEOUT
        value: 120s
      - key: HTTP_READ_HEADER_TIMEOUT
        value: 10s
    # NOTE: `free` sleeps when idle (cold starts + dropped connections).
    # Use `starter` or above for production.
    plan: starter
    region: singapore
