name: validate

on:
  push:
    paths:
      - "docs/**"
      - "infrastructure/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "docs/**"
      - "infrastructure/**"
      - ".github/workflows/validate.yml"

jobs:
  openapi:
    name: openapi spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OpenAPI 3.1
        uses: char0n/redocly-cli-action@v1
        with:
          spec: docs/openapi.yaml
          command: lint
          args: --skip-rule operation-summary

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: terraform fmt
        run: |
          cd infrastructure
          terraform fmt -check -recursive

      - name: terraform init
        run: |
          cd infrastructure
          terraform init -backend=false

      - name: terraform validate
        run: |
          cd infrastructure
          terraform validate -no-color
