name: validate

on:
  push:
    paths:
      - "docs/**"
      - "infrastructure/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "docs/**"
      - "infrastructure/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi:
    name: openapi spec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate OpenAPI 3.1
        uses: char0n/redocly-cli-action@v1
        with:
          spec: docs/openapi.yaml
          command: lint
          args: --skip-rule operation-summary

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.6.0

      - name: terraform fmt
        run: terraform fmt -check -recursive infrastructure

      - name: terraform validate (each module)
        run: |
          for dir in infrastructure/neon infrastructure/cloudflare_r2 infrastructure/cloudflare_dns; do
            echo "=== $dir ==="
            (cd "$dir" && terraform init -backend=false && terraform validate -no-color)
          done
